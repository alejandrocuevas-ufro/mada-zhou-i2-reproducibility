name: R | determinant boundary checks

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinant-boundary:
    name: Check determinant/rho diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Record R version
        run: Rscript -e 'print(R.version.string); print(sessionInfo())'

      - name: Verify determinant boundary and archived example
        run: Rscript scripts/05_test_determinant_boundary.R

      - name: Verify formal phase A theorems and archived TCCS case
        run: Rscript scripts/06_test_phase_a.R

      - name: Upload deterministic CSVs and figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinant-boundary-results
          path: |
            analisis_determinante_rho_v01_salida/
            phase_A_outputs/
          if-no-files-found: warn
          retention-days: 30
